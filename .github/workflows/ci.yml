name: Testes de API e E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      - name: Executar testes Java
        working-directory: api
        env:
          SQA_DB_USER: root
          SQA_DB_PASSWORD: ci_test_password
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Instalar dependências do site
        working-directory: client
        # O lockfile original do frontend não é compatível com npm ci.
        run: npm install --no-audit --no-fund

      - name: Executar testes Jest
        working-directory: client
        run: npm test -- --runInBand --passWithNoTests

      - name: Validar compilação do site
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8081
        run: npm run build

      - name: Iniciar a API
        working-directory: api
        env:
          SQA_DB_USER: root
          SQA_DB_PASSWORD: ci_test_password
        run: |
          nohup ./mvnw -B spring-boot:run > /tmp/sqa-api.log 2>&1 &
          for i in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8081/posts?limit=1 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 /tmp/sqa-api.log
          exit 1

      - name: Iniciar a Home
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8081
        run: |
          nohup npm run start -- --hostname 127.0.0.1 > /tmp/sqa-client.log 2>&1 &
          for i in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 /tmp/sqa-client.log
          exit 1

      - name: Instalar Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar 5 testes de API e 3 E2E
        working-directory: tests
        env:
          CI: 'true'
        run: npx playwright test tests/api tests/e2e --project=chromium --workers=1 --reporter=line

      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
